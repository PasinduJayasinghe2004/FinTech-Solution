version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: tuitionpay-postgres
    restart: always
    environment:
      POSTGRES_USER: tuitionpay_user
      POSTGRES_PASSWORD: tuitionpay_password
      POSTGRES_DB: tuitionpay_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Optional PgAdmin Web GUI for managing database (Access via http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tuitionpay-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tuitionpay.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
